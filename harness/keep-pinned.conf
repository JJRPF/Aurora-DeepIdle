# Do not move aside module trees that carry a .keep marker (hand-installed kernels such as
# linux-aurora 11.35-sep and the deep idle test kernel). Same loop as kernel-modules-hook's,
# plus the marker test. Added 2026-10-15 after booting a test kernel removed 11.35-sep's modules.
[Service]
ExecStart=
ExecStart=/bin/bash -exc 'for i in /usr/lib/modules/[0-9]*; do if [[ $${i##*/} = \'%v\' ]] || [[ -e $${i}/.keep ]] || pacman -Qo "$${i}"; then continue; fi; rsync -AHXal "$${i}" /usr/lib/modules/.old/; rm -rf "$${i}"; done'
